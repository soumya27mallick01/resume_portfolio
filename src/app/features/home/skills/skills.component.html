<div class="container">
  <app-section-header
    icon="zap"
    eyebrow="Technical Skills"
    title="Technologies I Work With"
    subtitle="A curated stack refined across enterprise and government platforms."
  />

  <div
    class="skills__carousel"
    appReveal
    (mouseenter)="paused.set(true)"
    (mouseleave)="paused.set(false)"
  >
    <!-- <button
      class="skills__nav skills__nav--prev"
      (click)="prev()"
      aria-label="Previous skill group"
    >
      <app-icon name="chevron-left" [size]="18" />
    </button> -->

    <div class="skills__stage">
      @for (group of skillGroups; track group.title; let i = $index) {
        <section
          class="skills__group glass-card"
          [class.skills__group--active]="i === activeIndex()"
          [style.transform]="cardTransform(i)"
          [style.opacity]="cardOpacity(i)"
          [style.zIndex]="cardZ(i)"
          (click)="focus(i)"
        >
          <header class="skills__group-header">
            <div class="skills__group-title">
              <app-icon name="layers" [size]="18" />
              <h3>{{ group.title }}</h3>
            </div>
            <p>{{ group.description }}</p>
          </header>

          <div class="skills__list">
            @for (skill of group.skills; track skill.name) {
              <div class="skill">
                <div class="skill__row">
                  <span class="skill__icon"><app-icon [name]="skill.icon" [size]="17" /></span>
                  <span class="skill__name">{{ skill.name }}</span>
                  <span class="skill__level">{{ skill.level }}%</span>
                </div>
                <div
                  class="skill__bar"
                  role="progressbar"
                  [attr.aria-label]="skill.name"
                  [attr.aria-valuenow]="skill.level"
                  aria-valuemin="0"
                  aria-valuemax="100"
                >
                  <span class="skill__fill" [style.--target]="skill.level + '%'"></span>
                </div>
              </div>
            }
          </div>
        </section>
      }
    </div>

    <!-- <button
      class="skills__nav skills__nav--next"
      (click)="next()"
      aria-label="Next skill group"
    >
      <app-icon name="chevron-right" [size]="18" />
    </button> -->

    <div class="skills__dots">
      @for (group of skillGroups; track group.title; let i = $index) {
        <button
          class="skills__dot"
          [class.skills__dot--active]="i === activeIndex()"
          (click)="focus(i)"
          [attr.aria-label]="'Go to ' + group.title"
        ></button>
      }
    </div>
  </div>
</div>
