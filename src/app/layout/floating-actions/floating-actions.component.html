<span
  class="fab-label"
  [class.fab-label--visible]="sectionLabel() !== null && progress.scrolledPastThreshold()"
>
  @if (sectionLabel(); as label) {
    @for (section of [label]; track section) {
      <span class="fab-label__pill">
        <app-icon [name]="sectionIcon()" [size]="12" />
        {{ label }}
      </span>
    }
  }
</span>

<button
  class="fab"
  [class.fab--visible]="progress.scrolledPastThreshold()"
  [class.fab--snap]="snap()"
  (click)="scrollToTop()"
  [attr.aria-label]="'Back to top'"
>
  <svg class="fab__ring" viewBox="0 0 48 48" aria-hidden="true">
    <circle class="fab__ring-track" cx="24" cy="24" r="21" />
    <circle
      class="fab__ring-progress"
      cx="24"
      cy="24"
      r="21"
      [style.stroke-dashoffset]="ringOffset()"
    />
  </svg>
  <app-icon class="fab__icon" name="arrow-up" [size]="18" />
</button>
