<div class="loading-screen__stage" aria-hidden="true">
  <canvas class="loading-screen__canvas" aria-hidden="true"></canvas>
</div>

<span class="loading-screen__corner loading-screen__corner--tl" aria-hidden="true"></span>
<span class="loading-screen__corner loading-screen__corner--tr" aria-hidden="true"></span>
<span class="loading-screen__corner loading-screen__corner--bl" aria-hidden="true"></span>
<span class="loading-screen__corner loading-screen__corner--br" aria-hidden="true"></span>

<div class="loading-screen__brand" aria-hidden="true">
  <div class="loading-screen__monogram">
    <span class="loading-screen__ring" aria-hidden="true"></span>
    <span class="loading-screen__circle">
      <span class="loading-screen__mark">SM</span>
    </span>
  </div>

  <p class="loading-screen__name">Soumya Kumar Mallick</p>
  <p class="loading-screen__role">Senior Frontend Developer</p>
</div>

<div class="loading-screen__hud" aria-hidden="true">
  <span class="loading-screen__pct">{{ pct() }}%</span>
  <span class="loading-screen__bar">
    <span class="loading-screen__bar-fill" [style.width.%]="pct()"></span>
  </span>
</div>
